name: Derle ve yükle

# main'e her gönderimde ya da elle: testler → APK + AAB → (isteğe bağlı) Play Console → Telegram
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'n8n/**', 'store/**']
  workflow_dispatch:
    inputs:
      track:
        description: 'Play kanalı (internal / alpha / beta / production / none)'
        default: 'internal'
      notes:
        description: 'Sürüm notu'
        default: ''
  workflow_call:
    inputs:
      ref: { type: string, required: true }
      track: { type: string, default: 'internal' }
      notes: { type: string, default: '' }

concurrency: { group: build, cancel-in-progress: false }

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TRACK: ${{ inputs.track || vars.PLAY_TRACK || 'internal' }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      NOTES: ${{ inputs.notes }}
      HAS_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
      HAS_PLAY: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref || github.sha }}" }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21, cache: gradle }
      - run: npm ci
      - name: Fizik testleri (her bölüm çözülebilir mi?)
        run: npm test
      - name: Web dosyaları
        run: npm run build:web && npm run build:preview
      - name: Android ayarları
        run: |
          # dakika cinsinden, her iki iş akışında da hep artan sürüm kodu
          export VERSION_CODE=$(( ($(date +%s) - 1767225600) / 60 ))
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          node scripts/patch-android.js && npx cap sync android
      - name: İmza anahtarı
        id: key
        if: env.HAS_KEY == 'true'
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          K_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
          K_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Kopyala-yapıştır hatalarını tolere et: boşluklar, satır sonları, "AD=değer" biçimi
          clean() { printf '%s' "$1" | sed -E 's/^[A-Z_]+=//' | tr -d ' \r\n\t'; }
          printf '%s' "$KS_B64" | tr -d ' \r\n\t' | base64 -d > "$RUNNER_TEMP/upload-key.jks" 2>/dev/null || true
          KSP=$(clean "$KS_PASS"); KP=$(clean "$K_PASS"); KA=$(clean "$K_ALIAS"); [ -z "$KP" ] && KP="$KSP"
          echo "::add-mask::$KSP"; echo "::add-mask::$KP"
          MSG=""
          if [ ! -s "$RUNNER_TEMP/upload-key.jks" ]; then MSG="ANDROID_KEYSTORE_BASE64 çözülemedi. upload-key.jks.base64.txt dosyasının tamamını yeniden yapıştır."
          elif ! keytool -list -keystore "$RUNNER_TEMP/upload-key.jks" -storepass "$KSP" >/dev/null 2>&1; then MSG="ANDROID_KEYSTORE_PASSWORD yanlış. sifreler.txt içinde '=' işaretinden SONRAKİ kısmı yapıştır."
          elif ! keytool -list -keystore "$RUNNER_TEMP/upload-key.jks" -storepass "$KSP" -alias "$KA" >/dev/null 2>&1; then MSG="ANDROID_KEY_ALIAS yanlış. Değeri sadece: upload"
          fi
          if [ -n "$MSG" ]; then echo "::error::$MSG"; echo "msg=$MSG" >> $GITHUB_OUTPUT; exit 1; fi
          { echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-key.jks"; echo "ANDROID_KEYSTORE_PASSWORD=$KSP"; echo "ANDROID_KEY_PASSWORD=$KP"; echo "ANDROID_KEY_ALIAS=$KA"; } >> $GITHUB_ENV
          echo "İmza anahtarı doğrulandı."
      - name: Gradle derlemesi
        working-directory: android
        run: chmod +x gradlew && ./gradlew --no-daemon bundleRelease assembleRelease
      - name: Dosyaları topla
        id: out
        run: |
          mkdir -p out
          NAME=$(node -p "require('./app.config.json').appName.replace(/[^A-Za-z0-9]+/g,'-')")
          V=$(node -p "require('./app.config.json').versionName")-${VERSION_CODE}
          cp android/app/build/outputs/bundle/release/app-release.aab "out/$NAME-$V.aab"
          APK=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          cp "$APK" "out/$NAME-$V.apk"; cp dist/preview.html out/
          echo "apk=out/$NAME-$V.apk" >> $GITHUB_OUTPUT; echo "aab=out/$NAME-$V.aab" >> $GITHUB_OUTPUT; echo "v=$V" >> $GITHUB_OUTPUT
      - uses: actions/upload-artifact@v4
        with: { name: "surum-${{ steps.out.outputs.v }}", path: out/ }
      - name: Play Console'a yükle
        id: play
        if: env.TRACK != 'none' && env.HAS_PLAY == 'true' && env.HAS_KEY == 'true'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ vars.APP_ID || 'com.torkgaraji.app' }}
          releaseFiles: ${{ steps.out.outputs.aab }}
          track: ${{ env.TRACK }}
          status: ${{ vars.PLAY_RELEASE_STATUS || 'completed' }}
      - name: Telegram — başarılı
        if: success()
        run: |
          PLAY="Play: yüklenmedi (ayar yok ya da kanal 'none')"
          [ "${HAS_KEY}" != "true" ] && PLAY="${PLAY}
          ⚠️ İmza anahtarı eklenmemiş: bu APK test imzalı, Play'e yüklenemez."
          [ "${{ steps.play.outcome }}" = "success" ] && PLAY="Play: '${TRACK}' kanalına yüklendi"
          scripts/telegram.sh "✅ Sürüm ${{ steps.out.outputs.v }} hazır
          ${PLAY}
          ${NOTES}" "${{ steps.out.outputs.apk }}"
      - name: Telegram — hata
        if: failure()
        run: |
          if [ -n "${{ steps.key.outputs.msg }}" ]; then
            scripts/telegram.sh "❌ İmza anahtarı sorunu: ${{ steps.key.outputs.msg }}
          GitHub → Settings → Secrets and variables → Actions sayfasında düzeltip /apk yaz."
          else
            scripts/telegram.sh "❌ Derleme başarısız. Ayrıntı: ${RUN_URL}"
          fi
